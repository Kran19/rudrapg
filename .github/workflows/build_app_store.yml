name: Build App Store & Play Store Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd student
          flutter pub get

      - name: Build Android App Bundle
        run: |
          cd student
          flutter build appbundle --release --no-pub

      - name: Upload Android Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: student/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS Archive (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd student
          flutter pub get

      - name: Build iOS Archive
        run: |
          cd student
          flutter build ipa --release --no-codesign

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive
          path: student/build/ios/archive/
