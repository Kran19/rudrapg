<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Rudra Group PG">

  <title>Rudra Group PG</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Handle explicit sign-out or login redirect requests
    try {
      var p = new URLSearchParams(window.location.search);
      if (p.has('logout') || p.get('screen') === 'login') {
        localStorage.clear();
        sessionStorage.clear();
      }
    } catch (e) {}
  </script>
</head>
