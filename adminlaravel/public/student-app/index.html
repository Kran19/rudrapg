<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rudra Group PG Student Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rudra Group PG">

  <title>Rudra Group PG</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 1. Purge obsolete service workers and caches from previous builds
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) { reg.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) { caches.delete(name); }
        });
      }
    } catch (e) {}

    // 2. Wipe stale saved resident sessions (e.g. test student 'meet')
    try {
      if (!localStorage.getItem('rudra_session_reset_20261105')) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('rudra_session_reset_20261105', 'done');
      }
      var p = new URLSearchParams(window.location.search);
      if (p.has('logout') || p.get('screen') === 'login') {
        localStorage.clear();
        sessionStorage.clear();
      }
    } catch (e) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=20261105_03" async></script>
</body>
</html>
