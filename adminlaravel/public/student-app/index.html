<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rudra Group PG Student Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rudra Group PG">

  <title>Rudra Group PG</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Invalidate stale Service Worker and Caches to prevent old build loops
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) { reg.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) { caches.delete(name); }
        });
      }
      var p = new URLSearchParams(window.location.search);
      if (p.has('logout') || p.get('screen') === 'login') {
        localStorage.clear();
        sessionStorage.clear();
      }
    } catch (e) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
