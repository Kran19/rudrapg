<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rudra Group PG Student Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rudra Group PG">

  <title>Rudra Group PG</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 1. Purge obsolete service workers and caches from previous builds
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) { reg.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) { caches.delete(name); }
        });
      }
    } catch (e) {}

    // 2. Wipe stale saved resident sessions (e.g. test student 'meet')
    try {
      if (!localStorage.getItem('rudra_session_reset_20261105')) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('rudra_session_reset_20261105', 'done');
      }
      var p = new URLSearchParams(window.location.search);
      if (p.has('logout') || p.get('screen') === 'login') {
        localStorage.clear();
        sessionStorage.clear();
      }
    } catch (e) {}

    // 3. Resident Change Password Modal System
    window.openChangePasswordModal = function() {
      var existing = document.getElementById('rudra-cp-modal-overlay');
      if (existing) { existing.remove(); }

      var overlay = document.createElement('div');
      overlay.id = 'rudra-cp-modal-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box;';

      var card = document.createElement('div');
      card.style.cssText = 'background:#ffffff;border-radius:16px;width:100%;max-width:420px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2),0 8px 10px -6px rgba(0,0,0,0.1);box-sizing:border-box;';

      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;color:#2563eb;font-size:20px;font-weight:bold;">
              &#128274;
            </div>
            <div>
              <div style="font-size:18px;font-weight:700;color:#0f172a;line-height:1.2;">Change Password</div>
              <div style="font-size:12px;color:#64748b;margin-top:2px;">Update your resident account credentials</div>
            </div>
          </div>
          <button id="rudra-cp-close-btn" style="background:none;border:none;font-size:24px;color:#94a3b8;cursor:pointer;padding:4px 8px;line-height:1;">&times;</button>
        </div>

        <div id="rudra-cp-alert" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.4;"></div>

        <div style="margin-bottom:14px;">
          <label style="display:block;font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px;">Current Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input type="password" id="rudra-cp-cur" placeholder="Enter current password" style="width:100%;padding:10px 38px 10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;" />
            <button type="button" onclick="rudraTogglePwd('rudra-cp-cur', this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#64748b;font-size:14px;">&#128065;</button>
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <label style="display:block;font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px;">New Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input type="password" id="rudra-cp-new" placeholder="Minimum 6 characters" style="width:100%;padding:10px 38px 10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;" />
            <button type="button" onclick="rudraTogglePwd('rudra-cp-new', this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#64748b;font-size:14px;">&#128065;</button>
          </div>
        </div>

        <div style="margin-bottom:20px;">
          <label style="display:block;font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px;">Confirm New Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input type="password" id="rudra-cp-cnf" placeholder="Re-enter new password" style="width:100%;padding:10px 38px 10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;" />
            <button type="button" onclick="rudraTogglePwd('rudra-cp-cnf', this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#64748b;font-size:14px;">&#128065;</button>
          </div>
        </div>

        <div style="display:flex;gap:12px;">
          <button id="rudra-cp-cancel-btn" style="flex:1;padding:12px;border:1px solid #cbd5e1;background:#ffffff;color:#475569;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;">Cancel</button>
          <button id="rudra-cp-submit-btn" style="flex:2;padding:12px;border:none;background:#0f172a;color:#ffffff;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 2px 4px rgba(15,23,42,0.2);">Update Password</button>
        </div>
      `;

      overlay.appendChild(card);
      document.body.appendChild(overlay);

      var close = function() { overlay.remove(); };
      document.getElementById('rudra-cp-close-btn').onclick = close;
      document.getElementById('rudra-cp-cancel-btn').onclick = close;

      window.rudraTogglePwd = function(inputId, btn) {
        var input = document.getElementById(inputId);
        if (input.type === 'password') {
          input.type = 'text';
          btn.style.opacity = '1';
        } else {
          input.type = 'password';
          btn.style.opacity = '0.6';
        }
      };

      document.getElementById('rudra-cp-submit-btn').onclick = function() {
        var cur = document.getElementById('rudra-cp-cur').value.trim();
        var newPwd = document.getElementById('rudra-cp-new').value;
        var cnfPwd = document.getElementById('rudra-cp-cnf').value;
        var alertEl = document.getElementById('rudra-cp-alert');
        var submitBtn = document.getElementById('rudra-cp-submit-btn');

        var showAlert = function(msg, isSuccess) {
          alertEl.style.display = 'block';
          alertEl.style.background = isSuccess ? '#ecfdf5' : '#fef2f2';
          alertEl.style.color = isSuccess ? '#065f46' : '#991b1b';
          alertEl.style.border = isSuccess ? '1px solid #a7f3d0' : '1px solid #fecaca';
          alertEl.textContent = msg;
        };

        if (!cur) {
          showAlert('Please enter your current password.', false);
          return;
        }
        if (newPwd.length < 6) {
          showAlert('New password must be at least 6 characters.', false);
          return;
        }
        if (newPwd !== cnfPwd) {
          showAlert('New password and confirmation do not match.', false);
          return;
        }
        if (cur === newPwd) {
          showAlert('New password must be different from current password.', false);
          return;
        }

        var token = localStorage.getItem('flutter.auth_token') || localStorage.getItem('auth_token');
        if (token) {
          token = token.replace(/^["']|["']$/g, '');
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';
        alertEl.style.display = 'none';

        fetch('/api/v1/student/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Authorization': token ? ('Bearer ' + token) : ''
          },
          body: JSON.stringify({
            current_password: cur,
            new_password: newPwd,
            confirm_password: cnfPwd,
            password: newPwd,
            password_confirmation: cnfPwd
          })
        })
        .then(function(res) {
          return res.json().then(function(data) {
            return { status: res.status, data: data };
          });
        })
        .then(function(res) {
          if (res.status === 200 && res.data.status === 'success') {
            showAlert('Password updated successfully! You can now log in with your new password.', true);
            submitBtn.textContent = 'Success!';
            submitBtn.style.background = '#16a34a';
            setTimeout(function() {
              close();
            }, 1800);
          } else {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
            var msg = res.data.message || (res.data.errors && (res.data.errors.current_password || res.data.errors.password || Object.values(res.data.errors)[0])) || 'Failed to update password.';
            showAlert(Array.isArray(msg) ? msg[0] : msg, false);
          }
        })
        .catch(function(err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          showAlert('Network error: ' + err.message, false);
        });
      };
    };
    // Expose alias on document as well
    document.openChangePasswordModal = window.openChangePasswordModal;

    // 4. Background Real-time State Polling & Auto-sync Engine
    (function() {
      var lastProfileStatus = null;
      var lastKycStatus = null;
      var lastBedCode = null;
      var lastRentStatus = null;
      var lastDepositStatus = null;
      var lastComplaintsHash = null;
      var lastElectricityHash = null;

      function checkRealtimeUpdates() {
        var token = localStorage.getItem('flutter.auth_token') || localStorage.getItem('auth_token');
        if (!token) return;
        token = token.replace(/^["']|["']$/g, '');

        // 1. Sync Student Profile (KYC, Room/Bed assignment, Rent/Deposit Status)
        fetch('/api/v1/student/profile', {
          headers: {
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
          }
        })
        .then(function(res) {
          if (res.status === 401) return null;
          return res.json();
        })
        .then(function(data) {
          if (!data) return;
          var student = data.student || data.data || data;
          if (!student) return;

          var curStatus = String(student.status || '');
          var curKyc = String(student.kyc_status || '');
          var curBed = String((student.bed && student.bed.bed_code) || student.bed_code || '');
          var curRent = String(student.rent_status || '');
          var curDeposit = String(student.deposit_status || '');

          if (lastProfileStatus !== null && (
            lastProfileStatus !== curStatus ||
            lastKycStatus !== curKyc ||
            lastBedCode !== curBed ||
            lastRentStatus !== curRent ||
            lastDepositStatus !== curDeposit
          )) {
            console.log('[Realtime Sync] Profile status updated on server. Auto-updating screen.');
            window.location.reload();
            return;
          }

          lastProfileStatus = curStatus;
          lastKycStatus = curKyc;
          lastBedCode = curBed;
          lastRentStatus = curRent;
          lastDepositStatus = curDeposit;
        })
        .catch(function() {});

        // 2. Sync Complaint Ticket Statuses (e.g. PENDING -> OPEN -> SOLVED)
        fetch('/api/v1/student/complaints', {
          headers: {
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
          }
        })
        .then(function(res) {
          if (res.status === 401) return null;
          return res.json();
        })
        .then(function(data) {
          if (!data) return;
          var list = data.data || [];
          var hash = list.map(function(t) { return t.id + ':' + t.status; }).join('|');
          if (lastComplaintsHash !== null && lastComplaintsHash !== hash) {
            console.log('[Realtime Sync] Complaint ticket status updated on server. Auto-updating screen.');
            window.location.reload();
            return;
          }
          lastComplaintsHash = hash;
        })
        .catch(function() {});

        // 3. Sync Electricity Reading Statuses (e.g. PENDING -> APPROVED)
        fetch('/api/v1/student/electricity-readings', {
          headers: {
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
          }
        })
        .then(function(res) {
          if (res.status === 401) return null;
          return res.json();
        })
        .then(function(data) {
          if (!data) return;
          var list = data.data || [];
          var hash = list.map(function(e) { return e.id + ':' + e.status; }).join('|');
          if (lastElectricityHash !== null && lastElectricityHash !== hash) {
            console.log('[Realtime Sync] Electricity audit status updated on server. Auto-updating screen.');
            window.location.reload();
            return;
          }
          lastElectricityHash = hash;
        })
        .catch(function() {});
      }

      // Live polling every 5 seconds
      setInterval(checkRealtimeUpdates, 5000);

      // Instant sync whenever user switches to or unlocks the browser tab
      window.addEventListener('focus', checkRealtimeUpdates);
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          checkRealtimeUpdates();
        }
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=20261106_05" async></script>
</body>
</html>
